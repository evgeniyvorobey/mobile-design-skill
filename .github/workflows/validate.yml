name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository structure, links, and examples
        run: python3 scripts/validate_repo.py

      - name: Validate rubric judge runner fixtures
        run: python3 scripts/run_rubric_judge.py --dry-run

      - name: Validate rubric judge runner parser
        run: python3 scripts/run_rubric_judge.py --export-expected-output /tmp/rubric-judge-expected.jsonl --judge-output /tmp/rubric-judge-expected.jsonl

      - name: Validate rubric judge external command adapter
        run: python3 scripts/run_rubric_judge.py --judge-command "python3 scripts/rubric_judge_oracle_agent.py"
