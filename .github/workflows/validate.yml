name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository structure, links, and examples
        run: python3 scripts/validate_repo.py

      # Reads the INSTALL, not the repo. A copy install inlines a subset of the tree next
      # to a rewritten wrapper, so a reference valid here can dangle in what a user loads.
      - name: Verify both install methods resolve every reference
        run: python3 scripts/verify_install.py

      - name: Validate rubric fixture pack (schema, coverage, median rule)
        run: python3 scripts/run_rubric_judge.py --dry-run

      # Round-trips the runner's own expected output. Proves the JSONL parser, NOT design quality.
      - name: Self-test judge JSONL parser (round-trip, not a quality check)
        run: python3 scripts/run_rubric_judge.py --export-expected-output /tmp/rubric-judge-expected.jsonl --judge-output /tmp/rubric-judge-expected.jsonl

      # The oracle echoes each fixture's expected values back. Proves the stdin/stdout
      # contract, NOT that any model scores correctly.
      - name: Self-test judge command adapter (oracle, not a quality check)
        run: python3 scripts/run_rubric_judge.py --judge-command "python3 scripts/rubric_judge_oracle_agent.py"

      # Replays committed examples through the generation-eval scorer. Proves the
      # stdin/stdout adapter and that the scorer accepts known-good output. No model
      # runs here, so this is NOT evidence about generated design quality.
      - name: Self-test generation eval (oracle replay, not a quality check)
        run: python3 scripts/run_generation_eval.py --replayable-only --generate-command "python3 scripts/generation_oracle_agent.py"

      - name: Validate generation prompt pack
        run: python3 scripts/run_generation_eval.py --dry-run

      # Asserts the diversity metric SEPARATES a deliberately uniform corpus from a
      # varied one, and that the extractor reads a real committed response. Unlike an
      # oracle replay this can fail when the measurement stops discriminating.
      - name: Self-test diversity metric (discriminating, still not a model run)
        run: python3 scripts/run_diversity_eval.py --self-test

      # The only thing this harness is for is REFUSING to report a contrast whose own
      # null control failed. Reading the source for two constants cannot see a refusal
      # that has been widened into a no-op; running it can.
      - name: Self-test paired comparison (must refuse a failed control)
        run: python3 scripts/run_paired_eval.py --self-test

      # The stdin/stdout contract for an external paired judge. Proves the adapter,
      # NOT that any model prefers the better design.
      - name: Self-test paired comparison judge adapter (oracle, not a quality check)
        run: python3 scripts/run_paired_eval.py --fixture-arms separating --judge-command "python3 scripts/paired_eval_oracle_agent.py"
