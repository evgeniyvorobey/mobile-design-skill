name: Release Validate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Optional tag/ref to validate, for example v1.14.0 or refs/tags/v1.14.0"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-validate:
    name: Release validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # On a tag push the tag itself is the ref under validation, so the version/tag
      # sanity check runs with `--tag-or-ref` instead of being silently skipped.
      - name: Run release validation
        env:
          RELEASE_REF: ${{ inputs.release_ref || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$RELEASE_REF" ]; then
            args+=(--tag-or-ref "$RELEASE_REF")
          fi
          python3 scripts/validate_release.py "${args[@]}"
